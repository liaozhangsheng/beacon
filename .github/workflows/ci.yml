name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            platform: linux-x64
          - name: Windows
            os: windows-2022
            triplet: x64-windows
            platform: windows-x64
          - name: macOS
            os: macos-15
            triplet: arm64-osx-dynamic
            platform: macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # vcpkg is checked out at the manifest's builtin-baseline, so every build of a commit gets the same ports.
      - name: Bootstrap vcpkg
        if: matrix.triplet
        shell: bash
        run: |
          vcpkg_root="$RUNNER_TEMP/vcpkg"
          baseline="$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' vcpkg.json)"
          git init --quiet "$vcpkg_root"
          git -C "$vcpkg_root" fetch --quiet --depth 1 https://github.com/microsoft/vcpkg.git "$baseline"
          git -C "$vcpkg_root" checkout --quiet FETCH_HEAD
          binary_cache="$RUNNER_TEMP/vcpkg-archives"
          mkdir -p "$binary_cache"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$vcpkg_root/bootstrap-vcpkg.bat" -disableMetrics
            vcpkg_root="$(cygpath -m "$vcpkg_root")"
            binary_cache="$(cygpath -m "$binary_cache")"
          else
            "$vcpkg_root/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$binary_cache" >> "$GITHUB_ENV"

      - name: Cache vcpkg packages
        if: matrix.triplet
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            catch2 clang-format libarchive-dev libfreetype-dev libssl-dev ninja-build pkg-config \
            libasound2-dev libpulse-dev libfribidi-dev libjack-dev libsndio-dev \
            libaudio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev \
            libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev

      - name: Build SDL3
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sdl_source="$RUNNER_TEMP/SDL"
          sdl_build="$RUNNER_TEMP/SDL-build"
          sdl_prefix="$RUNNER_TEMP/SDL-prefix"
          git clone --depth 1 --branch release-3.2.6 https://github.com/libsdl-org/SDL.git "$sdl_source"
          cmake -S "$sdl_source" -B "$sdl_build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_DISABLE_INSTALL_DOCS=ON
          cmake --build "$sdl_build" --parallel
          cmake --install "$sdl_build" --prefix "$sdl_prefix"
          echo "CMAKE_PREFIX_PATH=$sdl_prefix${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$sdl_prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Only tools come from Homebrew; the bundled libraries come from the pinned vcpkg baseline. The tests sign
          # manifests with OpenSSL 3's command line, which the runner's default openssl lacks.
          brew install llvm@18 ninja openssl@3 pkgconf
          echo "BEACON_OPENSSL_EXECUTABLE=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
          llvm_root="$(brew --prefix llvm@18)"
          echo "$llvm_root/bin" >> "$GITHUB_PATH"
          echo "CC=$llvm_root/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$llvm_root/bin/clang++" >> "$GITHUB_ENV"

      - name: Install vcpkg dependencies
        if: matrix.triplet
        shell: bash
        run: >-
          "$RUNNER_TEMP/vcpkg/vcpkg${{ runner.os == 'Windows' && '.exe' || '' }}"
          install --x-feature=tests --triplet "${{ matrix.triplet }}"

      - name: Add runtime libraries to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          runtime_dir="$GITHUB_WORKSPACE/build/vcpkg_installed/${{ matrix.triplet }}/bin"
          runtime_dir="$(cygpath -m "$runtime_dir")"
          echo "$runtime_dir" >> "$GITHUB_PATH"

      - name: Prepare update verification key
        shell: bash
        env:
          BEACON_UPDATE_PUBLIC_KEY: ${{ vars.BEACON_UPDATE_PUBLIC_KEY }}
        run: |
          if [ -n "$BEACON_UPDATE_PUBLIC_KEY" ]; then
            public_key="$RUNNER_TEMP/beacon-update-public-key.pem"
            printf '%s\n' "$BEACON_UPDATE_PUBLIC_KEY" > "$public_key"
            cmake_public_key="$public_key"
            if [ "$RUNNER_OS" = "Windows" ]; then
              cmake_public_key="$(cygpath -m "$public_key")"
            fi
            echo "BEACON_UPDATE_PUBLIC_KEY_FILE=$cmake_public_key" >> "$GITHUB_ENV"
          fi

      - name: Configure
        shell: bash
        run: |
          cmake_args=(
            -S .
            -B build
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_TESTING=ON
            -DBEACON_REQUIRE_LICENSES=ON
          )
          if [ -n "${{ matrix.triplet }}" ]; then
            cmake_args+=(
              "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
              "-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}"
            )
          fi
          if [ -n "${BEACON_OPENSSL_EXECUTABLE:-}" ]; then
            cmake_args+=("-DBEACON_OPENSSL_EXECUTABLE=$BEACON_OPENSSL_EXECUTABLE")
          fi
          if [ -n "${BEACON_UPDATE_PUBLIC_KEY_FILE:-}" ]; then
            cmake_args+=("-DBEACON_UPDATE_PUBLIC_KEY_FILE=$BEACON_UPDATE_PUBLIC_KEY_FILE")
          fi
          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cmake --build build --target format-check

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cmake --build build --target package --config Release

      - name: Test extracted package and bundled template skill
        shell: bash
        run: python test/package_smoke.py build/beacon-*.zip

      - name: Build update packages
        shell: bash
        env:
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          full_archive="$(find build -maxdepth 1 -type f -name 'beacon-*.zip' -print -quit)"
          if [ -z "$full_archive" ]; then
            echo 'CPack did not produce a full ZIP' >&2
            exit 1
          fi
          version="$(sed -n 's/^set(CPACK_PACKAGE_VERSION "\([^"]*\)")$/\1/p' build/CPackConfig.cmake | head -n 1)"
          if [ -z "$version" ]; then
            echo 'CPack package version is missing' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match CPack version $version" >&2
            exit 1
          fi
          manifest_version="$(sed -n 's/^  "version-string": "\([^"]*\)",$/\1/p' vcpkg.json)"
          if [ "$manifest_version" != "$version" ]; then
            echo "vcpkg.json version $manifest_version does not match CPack version $version" >&2
            exit 1
          fi
          python scripts/package_updates.py \
            --archive "$full_archive" \
            --output build/update-artifacts \
            --platform "${{ matrix.platform }}" \
            --version "$version" \
            --base-url "$RELEASE_BASE_URL"

      - name: Test generated full package
        shell: bash
        run: python test/package_smoke.py build/update-artifacts/beacon-*.zip

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: beacon-${{ matrix.name }}
          path: build/update-artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: beacon-*
          path: release-assets
          merge-multiple: true

      - name: Sign manifests or remove unsigned manifests
        shell: bash
        env:
          BEACON_UPDATE_SIGNING_KEY: ${{ secrets.BEACON_UPDATE_SIGNING_KEY }}
          BEACON_UPDATE_PUBLIC_KEY: ${{ vars.BEACON_UPDATE_PUBLIC_KEY }}
        run: |
          if [ -n "$BEACON_UPDATE_SIGNING_KEY" ]; then
            umask 077
            signing_key="$RUNNER_TEMP/beacon-update-signing-key.pem"
            public_key="$RUNNER_TEMP/beacon-update-public-key.pem"
            derived_public_key="$RUNNER_TEMP/beacon-derived-public-key.pem"
            configured_public_key="$RUNNER_TEMP/beacon-configured-public-key.pem"
            trap 'rm -f -- "$signing_key" "$public_key" "$derived_public_key" "$configured_public_key"' EXIT
            if [ -z "$BEACON_UPDATE_PUBLIC_KEY" ]; then
              echo 'BEACON_UPDATE_SIGNING_KEY requires BEACON_UPDATE_PUBLIC_KEY' >&2
              exit 1
            fi
            printf '%s\n' "$BEACON_UPDATE_SIGNING_KEY" > "$signing_key"
            printf '%s\n' "$BEACON_UPDATE_PUBLIC_KEY" > "$public_key"
            openssl pkey -in "$signing_key" -pubout -out "$derived_public_key"
            openssl pkey -pubin -in "$public_key" -pubout -out "$configured_public_key"
            if ! cmp -s "$derived_public_key" "$configured_public_key"; then
              echo 'BEACON_UPDATE_SIGNING_KEY does not match BEACON_UPDATE_PUBLIC_KEY' >&2
              exit 1
            fi
            for manifest in release-assets/release-*.json; do
              [ -f "$manifest" ] || continue
              openssl pkeyutl -sign -rawin -inkey "$signing_key" \
                -in "$manifest" -out "$manifest.sig"
              openssl pkeyutl -verify -rawin -pubin -inkey "$public_key" \
                -in "$manifest" -sigfile "$manifest.sig"
            done
          else
            # Builds with an embedded public key look for signed manifests, so they must not ship without them.
            if [ -n "$BEACON_UPDATE_PUBLIC_KEY" ]; then
              echo 'BEACON_UPDATE_PUBLIC_KEY requires BEACON_UPDATE_SIGNING_KEY' >&2
              exit 1
            fi
            find release-assets -type f -name 'release-*.json' -delete
            find release-assets -type f -name 'release-*.json.sig' -delete
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
