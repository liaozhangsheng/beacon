name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            triplet: x64-linux
          - name: Windows
            os: windows-2022
            triplet: x64-windows
          - name: macOS
            os: macos-15
            triplet: arm64-osx

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          vcpkg_root="$RUNNER_TEMP/vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$vcpkg_root"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$vcpkg_root/bootstrap-vcpkg.bat" -disableMetrics
            vcpkg_cmake_root="$(cygpath -m "$vcpkg_root")"
          else
            "$vcpkg_root/bootstrap-vcpkg.sh" -disableMetrics
            vcpkg_cmake_root="$vcpkg_root"
          fi
          echo "VCPKG_ROOT=$vcpkg_cmake_root" >> "$GITHUB_ENV"

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes autoconf autoconf-archive automake clang-format libtool

      - name: Install dependencies
        shell: bash
        run: >-
          "$RUNNER_TEMP/vcpkg/vcpkg${{ runner.os == 'Windows' && '.exe' || '' }}"
          install --x-feature=tests --triplet "${{ matrix.triplet }}"

      - name: Add runtime libraries to PATH
        shell: bash
        run: |
          runtime_dir="$GITHUB_WORKSPACE/build/vcpkg_installed/${{ matrix.triplet }}/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            runtime_dir="$(cygpath -m "$runtime_dir")"
          fi
          echo "$runtime_dir" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}"
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cmake --build build --target format-check

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cmake --build build --target package --config Release

      - name: Test extracted package and bundled template skill
        shell: bash
        run: python test/package_smoke.py build/beacon-*.zip

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: beacon-${{ matrix.name }}
          path: |
            build/beacon-*.tar.gz
            build/beacon-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: beacon-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
